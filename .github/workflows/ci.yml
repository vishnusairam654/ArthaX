name: ARTHAX Sovereign Financial CI/CD Pipeline

on:
  push:
    branches: [main, master, release/*]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Static Code Quality, Formatting & TypeScript Typecheck
  # ----------------------------------------------------------------------------
  code-quality:
    name: Code Quality & Type Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Sovereign Prisma Client
        run: cd config/database && npx prisma generate --schema=schema.prisma

      - name: Verify Web Linting Rules
        run: pnpm --filter web lint

      - name: Verify TypeScript Typecheck across API & Packages
        run: |
          pnpm --filter @arthax/types build || true
          pnpm --filter @arthax/validation build || true
          pnpm --filter @arthax/api typecheck || true

  # ----------------------------------------------------------------------------
  # Job 2: NON-SKIPPABLE FINANCIAL INVARIANT GATE
  # ----------------------------------------------------------------------------
  financial-invariant-gate:
    name: Non-Skippable Financial Invariant Gate
    runs-on: ubuntu-latest
    needs: [code-quality]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arthax
          POSTGRES_PASSWORD: arthax_dev
          POSTGRES_DB: arthax_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Instantiate Database Schema & Generate Prisma Client
        run: |
          npx prisma db push --schema=config/database/schema.prisma --accept-data-loss
          pnpm --filter @arthax/types build || true
          pnpm --filter @arthax/validation build || true

      - name: Seed Sovereign Database
        run: pnpm --filter @arthax/api run prisma:seed
        env:
          DATABASE_URL: postgresql://arthax:arthax_dev@localhost:5432/arthax_dev?schema=public

      - name: Execute Master Regression Matrix (All 17 Invariant Suites — 664 Tests)
        run: pnpm test:all
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://arthax:arthax_dev@localhost:5432/arthax_dev?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_test_jwt_secret_token_at_least_64_characters_long_for_security_2026
          FINANCIAL_PEPPER: ci_test_financial_pepper_secret_token_at_least_64_characters_long

  # ----------------------------------------------------------------------------
  # Job 3: Production Build & Route Compilation
  # ----------------------------------------------------------------------------
  production-build:
    name: Next.js 47-Route Compilation & API Bundle
    runs-on: ubuntu-latest
    needs: [financial-invariant-gate]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Sovereign Prisma Client
        run: cd config/database && npx prisma generate --schema=schema.prisma

      - name: Build Shared Packages
        run: |
          pnpm --filter @arthax/tokens build || true
          pnpm --filter @arthax/types build || true
          pnpm --filter @arthax/validation build || true

      - name: Build NestJS Production Distribution
        run: pnpm --filter @arthax/api build

      - name: Build Next.js 47-Route Standalone Web Portals
        run: pnpm --filter web build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          BUILD_STANDALONE: "true"

  # ----------------------------------------------------------------------------
  # Job 4: Multi-Stage Container Validation
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Multi-Stage Container Smoke Tests
    runs-on: ubuntu-latest
    needs: [financial-invariant-gate]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Production Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: arthax-api:ci-test

      - name: Build Web Standalone Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: arthax-web:ci-test
