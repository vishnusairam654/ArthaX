services:
  db:
    image: postgres:17-alpine
    container_name: arthax-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: arthax
      POSTGRES_PASSWORD: arthax
      POSTGRES_DB: arthax
    ports:
      - "5432:5432"
    volumes:
      - arthax_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arthax"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  arthax_pgdata:
