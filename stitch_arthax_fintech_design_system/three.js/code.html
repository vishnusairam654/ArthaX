<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_8 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_8" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_8');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // ARTHAX Sovereign Sovereign Vault & Monetary Ring 3D Scene
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || 420;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 1.2, 5.2);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// Master Group
const masterGroup = new THREE.Group();
scene.add(masterGroup);

// Materials using institutional palette: Deep Blue #1E3A5F & Arth Gold #A8742A & Off-white #F4EDE0
const goldMat = new THREE.MeshStandardMaterial({
  color: 0xD4A359,
  roughness: 0.28,
  metalness: 0.85,
  wireframe: false
});

const blueMat = new THREE.MeshStandardMaterial({
  color: 0x1E3A5F,
  roughness: 0.35,
  metalness: 0.6
});

const lightMat = new THREE.MeshStandardMaterial({
  color: 0xF4EDE0,
  roughness: 0.2,
  metalness: 0.3
});

// Central Monolith (Octagonal Sovereign Ledger Node)
const coreGeo = new THREE.CylinderGeometry(0.8, 0.95, 1.8, 8);
const coreMesh = new THREE.Mesh(coreGeo, blueMat);
coreMesh.position.y = 0;
masterGroup.add(coreMesh);

// Gold Core Ring / Cap
const capGeo = new THREE.CylinderGeometry(0.85, 0.82, 0.15, 8);
const capMeshTop = new THREE.Mesh(capGeo, goldMat);
capMeshTop.position.y = 0.98;
masterGroup.add(capMeshTop);

const capMeshBottom = new THREE.Mesh(capGeo, goldMat);
capMeshBottom.position.y = -0.98;
masterGroup.add(capMeshBottom);

// Floating Nested Orbital Rings (Financial Continuous Linked Settlement Ring)
const ringGeo1 = new THREE.TorusGeometry(1.65, 0.035, 16, 80);
const ring1 = new THREE.Mesh(ringGeo1, goldMat);
ring1.rotation.x = Math.PI / 3;
masterGroup.add(ring1);

const ringGeo2 = new THREE.TorusGeometry(2.05, 0.025, 16, 80);
const ring2 = new THREE.Mesh(ringGeo2, lightMat);
ring2.rotation.x = -Math.PI / 4;
ring2.rotation.y = Math.PI / 6;
masterGroup.add(ring2);

// Orbiting Settlement Nodes (Spheres representing institutional portals)
const nodeGroup = new THREE.Group();
masterGroup.add(nodeGroup);

const sphereGeo = new THREE.SphereGeometry(0.12, 16, 16);
const nodeCount = 5;
const nodes = [];

for (let i = 0; i < nodeCount; i++) {
  const angle = (i / nodeCount) * Math.PI * 2;
  const node = new THREE.Mesh(sphereGeo, (i % 2 === 0) ? goldMat : lightMat);
  node.userData = { angle: angle, distance: 1.65, speed: 0.015 + (i * 0.002) };
  nodeGroup.add(node);
  nodes.push(node);
}

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffeedd, 2.5);
dirLight.position.set(5, 8, 5);
scene.add(dirLight);

const blueFill = new THREE.PointLight(0x66A3BF, 2.2, 15);
blueFill.position.set(-4, -2, 3);
scene.add(blueFill);

const goldPoint = new THREE.PointLight(0xD4A359, 3.0, 10);
goldPoint.position.set(3, 2, -2);
scene.add(goldPoint);

// Mouse Interaction
let mouseX = 0;
let mouseY = 0;
let targetRotX = 0;
let targetRotY = 0;

function onMouseMove(e) {
  const rect = container.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  mouseX = (x / (rect.width || 1)) * 2 - 1;
  mouseY = -(y / (rect.height || 1)) * 2 + 1;
}

window.addEventListener('mousemove', onMouseMove);

// Resize handler
function onResize() {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || 420;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

// Animation Loop
let clock = 0;
let reqId;

function animate() {
  reqId = requestAnimationFrame(animate);
  clock += 0.016;

  // Gentle idle rotation + mouse dampening
  targetRotY = mouseX * 0.45;
  targetRotX = -mouseY * 0.25;

  masterGroup.rotation.y += (targetRotY - masterGroup.rotation.y) * 0.05 + 0.003;
  masterGroup.rotation.x += (targetRotX - masterGroup.rotation.x) * 0.05;

  // Inner rings spinning
  ring1.rotation.z += 0.008;
  ring2.rotation.z -= 0.006;
  ring2.rotation.x += Math.sin(clock * 0.5) * 0.002;

  // Nodes orbit
  nodes.forEach((node) => {
    node.userData.angle += node.userData.speed;
    node.position.x = Math.cos(node.userData.angle) * node.userData.distance;
    node.position.y = Math.sin(node.userData.angle * 2) * 0.35;
    node.position.z = Math.sin(node.userData.angle) * node.userData.distance;
  });

  // Pulse central monolith gently
  const s = 1 + Math.sin(clock * 1.5) * 0.015;
  coreMesh.scale.set(s, 1, s);

  renderer.render(scene, camera);
}

animate();

// Cleanup on removal
return function() {
  cancelAnimationFrame(reqId);
  window.removeEventListener('mousemove', onMouseMove);
  window.removeEventListener('resize', onResize);
  renderer.dispose();
  if (renderer.domElement && renderer.domElement.parentNode) {
    renderer.domElement.parentNode.removeChild(renderer.domElement);
  }
};

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_8 -->
</body>
</html>
